<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="40" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="70,50 65,20 85,45" fill="#FF9D5C" stroke="#000" stroke-width="2"/>
  <polygon points="72,48 70,30 82,45" fill="#FFB380"/>

  <!-- Right Ear -->
  <polygon points="130,50 135,20 115,45" fill="#FF9D5C" stroke="#000" stroke-width="2"/>
  <polygon points="128,48 130,30 118,45" fill="#FFB380"/>

  <!-- Left Eye -->
  <ellipse cx="85" cy="70" rx="8" ry="12" fill="#000"/>
  <ellipse cx="87" cy="67" rx="3" ry="5" fill="#FFF"/>

  <!-- Right Eye -->
  <ellipse cx="115" cy="70" rx="8" ry="12" fill="#000"/>
  <ellipse cx="117" cy="67" rx="3" ry="5" fill="#FFF"/>

  <!-- Nose -->
  <polygon points="100,80 95,85 105,85" fill="#FF6B9D"/>

  <!-- Mouth -->
  <path d="M 100,85 Q 95,90 90,88" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100,85 Q 105,90 110,88" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="60" y1="75" x2="40" y2="70" stroke="#000" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="40" y2="82" stroke="#000" stroke-width="1.5"/>
  <line x1="60" y1="85" x2="40" y2="90" stroke="#000" stroke-width="1.5"/>

  <!-- Whiskers Right -->
  <line x1="140" y1="75" x2="160" y2="70" stroke="#000" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="160" y2="82" stroke="#000" stroke-width="1.5"/>
  <line x1="140" y1="85" x2="160" y2="90" stroke="#000" stroke-width="1.5"/>

  <!-- Left Arm -->
  <ellipse cx="70" cy="130" rx="12" ry="30" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Right Arm -->
  <ellipse cx="130" cy="130" rx="12" ry="30" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Left Leg -->
  <ellipse cx="85" cy="175" rx="10" ry="20" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Right Leg -->
  <ellipse cx="115" cy="175" rx="10" ry="20" fill="#FF9D5C" stroke="#000" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 145,130 Q 165,120 175,140 Q 180,160 165,165" stroke="#000" stroke-width="2" fill="#FF9D5C"/>

  <!-- Belly Spot -->
  <ellipse cx="100" cy="140" rx="25" ry="35" fill="#FFB380" opacity="0.6"/>
</svg>
